<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reconocimiento de Dígitos</title>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"
            integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo="
            crossorigin="anonymous"></script>
</head>
<body>
    <h2>Dibuja un número</h2>
    <canvas id="canvas" width="280" height="280" 
            style="border:2px solid black; cursor:crosshair;"></canvas>
    <br><br>
    <button onclick="limpiar()">Limpiar</button>
    <button onclick="enviar()">Predecir</button>
    <h1 id="resultado"></h1>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Fondo blanco
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let painting = false;

        canvas.addEventListener('mousedown', () => painting = true);
        canvas.addEventListener('mouseup', () => {
            painting = false;
            ctx.beginPath();
        });
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!painting) return;
            ctx.lineWidth = 18;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'black';  // Trazo negro
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        }

        function limpiar() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            $("#resultado").html("");
        }

        function enviar() {
            $("#resultado").html("Procesando...");

            let tempCanvas = document.createElement('canvas');
            tempCanvas.width = 28;
            tempCanvas.height = 28;
            let tempCtx = tempCanvas.getContext('2d');

            // Fondo blanco igual que el canvas principal
            tempCtx.fillStyle = 'white';
            tempCtx.fillRect(0, 0, 28, 28);
            tempCtx.drawImage(canvas, 0, 0, 28, 28);

            var pixels = [];
            for (var x = 0; x < 28; x++) {
                for (var y = 0; y < 28; y++) {
                    var imgData = tempCtx.getImageData(y, x, 1, 1);
                    var data = imgData.data;
                    // Inversión: negro(0) → 1.0, blanco(255) → 0.0
                    var color = (255 - data[0]) / 255;
                    color = (Math.round(color * 100) / 100).toFixed(2);
                    pixels.push(color);
                }
            }

            $.post("http://localhost:8000", { pixeles: pixels.join(",") },
                function(response) {
                    console.log("Resultado: " + response);
                    $("#resultado").html(response);
                }
            ).fail(function(err) {
                $("#resultado").html("Error: " + err.statusText);
            });
        }
    </script>
</body>
</html>
